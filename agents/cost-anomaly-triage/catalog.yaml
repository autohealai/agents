display_name: Cost Anomaly Triage
category: cost
summary: For each daily Vantage cost anomaly, finds the deploy, config change, scaling event or traffic change that caused it, names the owning team, and proposes a fix with its dollar impact, as a pull request when the resource is declared in code.
trigger: schedule
safety: propose
requires:
  integrations:
  - github
  - slack
