# Catalog and gallery fields for this agent. They live here rather than in
# agent.yaml because an apiVersion agents.autoheal.ai/v1 document accepts only
# the platform's own keys. Not part of the agent: do not paste this file.
display_name: Service Scorecard
category: sre
summary: Every week, checks each service against the platform team's scorecard (on-call, SLO, monitors, runbook and so on). For a failing rule it opens a pull request in the owning repository, with SLO targets taken from the service's own 28-day history, and closes the ticket once the rule passes.
trigger: schedule
safety: propose
requires:
  integrations:
  - github
  - jira
