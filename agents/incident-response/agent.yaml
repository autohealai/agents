apiVersion: agents.autoheal.ai/v1
name: incident-response
icon: siren

description: >-
  Investigates a production incident end to end: gathers evidence from the
  connected observability and deployment sources, tests competing explanations
  through its own subagents, and proposes a bounded mitigation.

model:
  name: claude-sonnet-5
  max_tokens: 8192
  thinking: high

instructions: ./instructions.md

tools:
  - operation_type: read

skills:
  - ./skills:deploy-correlation
  - ./skills:rollback-verification
  - ./skills:retry-storm-diagnosis

artifacts:
  - hypothesis

# Two private children. Competing explanations are investigated in parallel,
# each in its own context, so one line of inquiry cannot quietly colour the
# others; the verifier then argues against whichever survived.
subagents:
  investigate_hypothesis:
    agent: ./agents:hypothesis-investigator
    description: >-
      Investigates ONE candidate explanation and reports whether the
      evidence supports it. Call once per competing hypothesis, in
      parallel.
  adversarial_verifier:
    agent: ./agents:adversarial-verifier
    description: >-
      Argues against the surviving explanation link by link and returns a
      verdict. Call once, after the hypotheses come back.

evals:
  - ./evals:root-cause-correctness
  - ./evals:evidence-grounding
  - ./evals:causal-chain-completeness
  - ./evals:hypothesis-verification
  - ./evals:mitigation-safety
  - ./evals:severity-calibration

returns:
  root_cause:
    type: string
    description: The single most likely root cause, one or two sentences.
    required: true
  confidence:
    type: number
    minimum: 0.0
    maximum: 1.0
    required: true
  summary: {type: string, required: true}
  severity:
    type: string
    enum: [sev1, sev2, sev3, sev4]
    required: true
  causal_chain: string[]
  rejected_hypotheses: string[]
  proposed_mitigation: string
  supporting_evidence: string[]
