# Incident Response: investigates a production incident and reports a root
# cause it has tried to disprove.
#
# It does not investigate competing explanations in parallel. It weighs them,
# commits to one, and records it in a `hypothesis` artifact with what it ruled
# out. Its private child, agents/incident-verifier/, is the check on that
# choice: it tries to break the record and writes its verdict onto it as
# `review`. The record is all the two agents share.
apiVersion: agents.autoheal.ai/v1
name: incident-response
icon: siren

description: >-
  Investigates a production incident end to end: gathers evidence, commits to a
  root-cause conclusion recorded as an artifact, has it adversarially verified,
  reworks it if the verdict says so, and reports the cause with its evidence and
  a proposed mitigation.

model:
  name: claude-sonnet-5
  max_tokens: 8192
  thinking: high
timeout: "45m"

instructions: ./instructions.md

system_tools: operation_type == "read" || name in ["create_artifact", "update_artifact"]
integration_tools: operation_type == "read"


# The project's `hypothesis` template, at artifact-templates/hypothesis/ in the
# project rather than in this agent's folder; the verifier names the same one.
# It grants create_artifact_hypothesis, which needs `system_tools` to keep
# create_artifact.
artifacts:
  - hypothesis

subagents:
  incident_verifier:
    agent: ./agents:incident-verifier
    description: >-
      Adversarially reviews the conclusion record: classifies every causal
      chain step against its evidence, probes the declared gaps, runs its
      own falsification attempts, calibrates confidence and writes a
      verdict onto the record. Dispatch once per verification pass.

evals:
  - ./evals:root-cause-correctness
  - ./evals:evidence-grounding
  - ./evals:causal-chain-completeness
  - ./evals:hypothesis-verification
  - ./evals:mitigation-safety

returns:
  root_cause:
    type: string
    description: >-
      The verified conclusion, in one or two plain sentences, no markdown.
      The write-up is in the record.
    required: true
  confidence:
    type: string
    enum: [Confirmed, Likely, Possible, Speculative]
    description: >-
      The label the evidence supports after verification. The record's
      write-up justifies it rather than repeating it.
    required: true
  hypothesis_artifact_id:
    type: string
    description: >-
      The conclusion record this investigation produced: the chain, the
      verifier's review, and the write-up.
  needs_human_input:
    type: boolean
    description: True when a human must answer something before this conclusion stands.
