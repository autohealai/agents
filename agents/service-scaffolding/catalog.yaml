display_name: Service Scaffolding
category: ci-cd
summary: Creates a repository for a new-service request from the approved (golden-path) template, and checks it against the six scorecard rules before handing it over. Also opens pull requests that move older scaffolds to the current template.
trigger: manual
safety: propose
requires:
  integrations:
  - github
