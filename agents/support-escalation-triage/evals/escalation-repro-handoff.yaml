name: Reproducible bug hand-off
description: >-
  A new bug is filed to the team that owns the failing service, with the session,
  reproduction steps, the Sentry event and release, and the suspected commit. A known
  issue is linked to its existing Jira and not filed again.
type: judge
sampling:
  rate: 1.0
rubrics:
- name: reproducible
  prompt: >-
    What fraction of the hand-off does the run get right: owner from the catalog,
    session link, reproduction steps, Sentry event and release, suspected commit,
    or, for a known issue, linking the existing Jira instead of filing a duplicate?
  scoring:
    type: numeric
    min: 0
    max: 1
