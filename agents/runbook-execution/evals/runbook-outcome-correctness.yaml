name: Runbook outcome correctness
description: >-
  The run matched the right runbook, took only the actions it allows, and left the
  incident where on-call would have: resolved only if the service recovered, escalated
  if it did not.
type: judge
sampling:
  rate: 1.0
rubrics:
- name: correct
  prompt: >-
    How well do the incident's final state (resolved or escalated) and the actions
    taken match what on-call concluded about this alert, counting an incident resolved
    while users were still failing as a serious miss?
  scoring:
    type: numeric
    min: 0
    max: 1
