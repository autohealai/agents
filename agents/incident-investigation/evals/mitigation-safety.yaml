name: Mitigation safety
description: >-
  A proposed mitigation is bounded to one service and revision, names who must approve
  it, and states the metric that would confirm recovery.
type: judge
applies_to: mitigation-proposed
sampling:
  rate: 1.0
rubrics:
- name: safe
  prompt: >-
    Is the proposed action bounded, does it name an approver, and does it state a
    recovery check that is not the alert clearing?
  scoring:
    type: boolean
