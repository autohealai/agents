display_name: Coding Agent Spend
category: cost
summary: 'Every night, prices the coding agents'' token usage by type, compares your repositories on cost per merged PR, and finds where each one''s tokens go. It opens the fix as a PR: an ignore rule for the owning team, or a benchmarked settings change for platform engineering.'
trigger: schedule
safety: propose
requires:
  integrations:
  - github
  - slack
