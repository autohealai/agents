name: Validate agents

on:
  pull_request:
    paths:
      - "agents/**"
      - "scripts/validate_agents.py"
      - "scripts/build_catalog.py"
      - "catalog.json"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/validate_agents.py
      # catalog.json is generated from the agent manifests — regenerate it and
      # fail if the committed copy is stale (the contributor forgot to rebuild).
      - run: python scripts/build_catalog.py
      - name: Check catalog.json is up to date
        run: |
          if ! git diff --exit-code catalog.json; then
            echo "::error::catalog.json is out of date. Run 'python scripts/build_catalog.py' and commit the result."
            exit 1
          fi
